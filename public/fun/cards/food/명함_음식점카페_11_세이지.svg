<svg xmlns="http://www.w3.org/2000/svg" width="90mm" height="105mm" viewBox="0 0 900 1050"><title>한OO 대표 바리스타 명함 (앞면·뒷면)</title><g id="front"><rect width="900" height="500" fill="#E1E8D9"/><polygon points="0,0 560,0 400,500 0,500" fill="#9CAF88"/><polygon points="560,0 590,0 430,500 400,500" fill="#6C8FB8" opacity="0.9"/><text font-family="Pretendard,'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20.5" font-weight="700" fill="#1B2230" text-anchor="start" letter-spacing="7.8" opacity="0.8"><tspan x="70" y="88">상호명</tspan></text><text font-family="Pretendard,'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="49.4" font-weight="700" fill="#1B2230" text-anchor="start" letter-spacing="3.5"><tspan x="70" y="213.5">한OO</tspan></text><text font-family="Pretendard,'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="400" fill="#1B2230" text-anchor="start" opacity="0.8"><tspan x="70" y="261.1">대표 바리스타</tspan></text><text font-family="Pretendard,'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.9" font-weight="700" fill="#666D70" text-anchor="start" letter-spacing="4.9"><tspan x="560" y="317.9">TEL</tspan></text><text font-family="Pretendard,'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21.2" font-weight="400" fill="#1B2230" text-anchor="start"><tspan x="638" y="318.6">010-1234-5678</tspan></text><text font-family="Pretendard,'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.9" font-weight="700" fill="#666D70" text-anchor="start" letter-spacing="4.9"><tspan x="560" y="357.9">MAIL</tspan></text><text font-family="Pretendard,'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21.2" font-weight="400" fill="#1B2230" text-anchor="start"><tspan x="63