# 서버 쪽 자동 검사 — 푸시 전 검사(pre-push)를 건너뛰어도 여기서 한 번 더 막습니다.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:fast
