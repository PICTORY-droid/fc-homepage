<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 손그림체 카페 이미지 틀 — make-hand-images.py 가 window.DATA 를 넣고 render() 를 부릅니다. 선은 rough.js(MIT), 글씨는 Jua·Gaegu(OFL) -->
<style>
@font-face{font-family:Jua;src:url(../assets/fonts/jua-korean-400-normal.woff2)}
@font-face{font-family:Gaegu;src:url(../assets/fonts/gaegu-korean-700-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;overflow:hidden;background:#FFFBF4}
#c{position:absolute;inset:0}
.txt{position:absolute;white-space:nowrap}
.chip{font-family:Jua;font-size:40px;color:#A34506}
.t1{font-family:Jua;font-size:100px;color:#3A3A3A;letter-spacing:-1px}
.t2{font-family:Jua;font-size:100px;color:#D9480F;letter-spacing:-1px}
.sub{font-family:Gaegu;font-size:52px;color:#6B5E57}
.brand{font-family:Gaegu;font-size:42px;color:#A34506}
.ct{font-family:Jua;font-size:62px;color:#3A3A3A}
.li{font-family:Gaegu;font-size:54px;color:#3A3A3A}
</style></head>
<body><svg id="c" width="1080" height="1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../assets/vendor/rough.js"></script>
<script>
const svg = document.getElementById("c");
const rc = rough.svg(svg);
const P = { ink: "#4A3F3A", orange: "#FF883A", red: "#D9480F", peach: "#FFDAC1", cream: "#FFF4EC", pink: "#F7A8B8", mint: "#7FD1B9", sky: "#9FD3F5", yellow: "#FFD66B" };
const add = (n) => (svg.appendChild(n), n);
// 게시판별 색 테마 — 게시판마다 한눈에 구분되게(기본: 우체국 주황). 이름이 없는 게시판은 기본 테마
const THEMES = {
  default: { bg: "#FFFBF4", frame: P.peach, stripe: [P.red, P.orange], chipFill: P.cream, chipLine: P.orange, chipText: "#A34506", t2: "#D9480F", under: P.yellow, brand: "#A34506", tape: P.yellow, rule: P.peach, dots: [P.orange, P.mint, P.pink, P.sky, P.yellow], spark: [P.yellow, P.orange, P.pink] },
  "실손의료비보험": { bg: "#F0F7FD", frame: "#A9D3F2", stripe: ["#2C7BC0", "#9FD3F5"], chipFill: "#E2F0FB", chipLine: "#3A8FD6", chipText: "#1F5F99", t2: "#2273BD", under: "#FFD66B", brand: "#1F5F99", tape: "#C5E3F7", rule: "#D3E8F7", dots: ["#3A8FD6", "#FFD66B", "#7FD1B9", "#F7A8B8", "#9FD3F5"], spark: ["#FFD66B", "#3A8FD6", "#F7A8B8"] },
  "어린이·엄마보험": { bg: "#FFF4F7", frame: "#F5C2D3", stripe: ["#D9577F", "#F7B6CB"], chipFill: "#FDE6EE", chipLine: "#E0709A", chipText: "#A63A62", t2: "#CC4A74", under: "#FFD66B", brand: "#A63A62", tape: "#F9D3E0", rule: "#F6DCE5", dots: ["#E0709A", "#FFD66B", "#9FD3F5", "#B9A6F0", "#7FD1B9"], spark: ["#FFD66B", "#E0709A", "#B9A6F0"] },
  "연금·저축보험": { bg: "#F0FAF4", frame: "#A8DCC4", stripe: ["#1E8C68", "#7FD1B9"], chipFill: "#E3F6EC", chipLine: "#2FA37F", chipText: "#17694F", t2: "#1E8C68", under: "#FFD66B", brand: "#17694F", tape: "#BDE8D3", rule: "#CDEBDD", dots: ["#2FA37F", "#FFD66B", "#9FD3F5", "#7FD1B9", "#F7A8B8"], spark: ["#FFD66B", "#2FA37F", "#9FD3F5"] },
};
let TH = THEMES.default;
const applyTheme = (menu) => {
  TH = THEMES[menu] ?? THEMES.default;
  document.body.style.background = TH.bg;
  const css = document.createElement("style");
  css.textContent = `.chip{color:${TH.chipText}}.t2{color:${TH.t2}}.brand{color:${TH.brand}}`;
  document.head.appendChild(css);
};
const text = (cls, s, x, y, anchor = "start") => {
  const d = document.createElement("div"); d.className = "txt " + cls; d.textContent = s; document.body.appendChild(d);
  const w = d.getBoundingClientRect().width;
  d.style.left = (anchor === "middle" ? x - w / 2 : anchor === "end" ? x - w : x) + "px"; d.style.top = y + "px"; return d;
};
const fitAll = (els, max) => { for (const e of els) { let f = parseFloat(getComputedStyle(e).fontSize); while (e.getBoundingClientRect().width > max && f > 36) { f -= 2; e.style.fontSize = f + "px"; } } };

// 편지봉투 캐릭터(손그림) — 홈페이지 캐릭터와 같은 생김새
function character(x, y, s = 1) {
  const g = (n) => { n.setAttribute("transform", `translate(${x},${y}) scale(${s})`); return add(n); };
  g(rc.rectangle(35, 55, 130, 100, { fill: "#fff", fillStyle: "solid", stroke: P.orange, strokeWidth: 4, roughness: 1.4 }));
  g(rc.path("M45 52 Q100 14 155 52 Z", { fill: P.orange, fillStyle: "solid", stroke: P.red, strokeWidth: 3, roughness: 1.2 }));
  g(rc.line(40, 52, 160, 52, { stroke: "#C4540A", strokeWidth: 7, roughness: 1 }));
  g(rc.circle(100, 33, 30, { fill: "#fff", fillStyle: "solid", stroke: "#C4540A", strokeWidth: 3 }));
  g(rc.path("M93 33 q7 -9 14 0 q-7 9 -14 0", { stroke: P.red, strokeWidth: 3, roughness: 0.8 }));
  g(rc.line(40, 150, 72, 128, { stroke: P.orange, strokeWidth: 4 })); g(rc.line(160, 150, 128, 128, { stroke: P.orange, strokeWidth: 4 }));
  g(rc.circle(78, 100, 10, { fill: P.ink, fillStyle: "solid", stroke: P.ink })); g(rc.circle(122, 100, 10, { fill: P.ink, fillStyle: "solid", stroke: P.ink }));
  g(rc.path("M88 112 Q100 124 112 112", { stroke: P.ink, strokeWidth: 4, roughness: 0.6 }));
  g(rc.circle(62, 114, 16, { fill: P.pink, fillStyle: "solid", stroke: "none" })); g(rc.circle(138, 114, 16, { fill: P.pink, fillStyle: "solid", stroke: "none" }));
}
function sparkle(x, y, r, c) { add(rc.line(x - r, y, x + r, y, { stroke: c, strokeWidth: 4 })); add(rc.line(x, y - r, x, y + r, { stroke: c, strokeWidth: 4 })); }

// 주제 그림
const ICONS = {
  checklist(x, y) {
    add(rc.rectangle(x, y, 230, 280, { fill: "#fff", fillStyle: "solid", stroke: P.ink, strokeWidth: 3 }));
    for (let i = 0; i < 4; i++) {
      const yy = y + 50 + i * 58;
      add(rc.rectangle(x + 28, yy - 16, 32, 32, { stroke: P.ink, strokeWidth: 3 }));
      add(rc.path(`M${x + 32} ${yy} l10 12 l22 -26`, { stroke: P.red, strokeWidth: 5, roughness: 0.8 }));
      add(rc.line(x + 78, yy, x + 200, yy, { stroke: P.peach, strokeWidth: 8 }));
    }
  },
  ribbon(x, y) {
    add(rc.path(`M${x + 115} ${y + 30} C${x + 40} ${y + 30} ${x + 50} ${y + 140} ${x + 115} ${y + 170} C${x + 180} ${y + 140} ${x + 190} ${y + 30} ${x + 115} ${y + 30} Z`, { fill: P.pink, fillStyle: "hachure", hachureGap: 9, stroke: "#E0607E", strokeWidth: 4 }));
    add(rc.path(`M${x + 95} ${y + 160} L${x + 45} ${y + 280} L${x + 90} ${y + 265} L${x + 115} ${y + 300}`, { stroke: "#E0607E", strokeWidth: 5, fill: P.pink, fillStyle: "solid" }));
    add(rc.path(`M${x + 135} ${y + 160} L${x + 185} ${y + 280} L${x + 140} ${y + 265} L${x + 115} ${y + 300}`, { stroke: "#E0607E", strokeWidth: 5, fill: P.pink, fillStyle: "solid" }));
  },
  // 보험료 그래프: 계단처럼 오르는 선 = 갱신형, 평평한 선 = 비갱신형 (손글씨 이름표)
  graph(x, y) {
    y -= 50; // 아래 브랜드 글씨와 겹치지 않게 위로
    add(rc.rectangle(x - 30, y - 10, 400, 320, { fill: "#fff", fillStyle: "solid", stroke: P.ink, strokeWidth: 3, roughness: 1.3 }));
    add(rc.line(x + 20, y + 250, x + 340, y + 250, { stroke: P.ink, strokeWidth: 4 }));      // 가로축(나이)
    add(rc.line(x + 20, y + 250, x + 20, y + 30, { stroke: P.ink, strokeWidth: 4 }));        // 세로축(보험료)
    add(rc.path(`M${x + 330} ${y + 240} l14 10 l-14 10`, { stroke: P.ink, strokeWidth: 4 }));
    add(rc.path(`M${x + 10} ${y + 42} l10 -14 l10 14`, { stroke: P.ink, strokeWidth: 4 }));
    add(rc.path(`M${x + 30} ${y + 205} H${x + 120} V${y + 160} H${x + 210} V${y + 110} H${x + 300} V${y + 60} H${x + 330}`, { stroke: P.red, strokeWidth: 7, roughness: 1.1 }));
    add(rc.line(x + 30, y + 150, x + 330, y + 150, { stroke: "#2FA37F", strokeWidth: 7, roughness: 1.1 }));
    const lab = (s, lx, ly, color) => { const d = text("li", s, lx, ly); d.style.fontSize = "38px"; d.style.color = color; };
    lab("갱신형", x + 175, y + 40, P.red);
    lab("비갱신형", x + 40, y + 98, "#2FA37F");
    lab("나이", x + 270, y + 258, P.ink);
  },
  calendar(x, y) {
    add(rc.rectangle(x, y + 20, 270, 260, { fill: "#fff", fillStyle: "solid", stroke: P.ink, strokeWidth: 3, roughness: 1.3 }));
    add(rc.rectangle(x, y + 20, 270, 62, { fill: P.orange, fillStyle: "hachure", hachureGap: 8, stroke: P.ink, strokeWidth: 3 }));
    add(rc.line(x + 70, y, x + 70, y + 44, { stroke: P.ink, strokeWidth: 8 })); add(rc.line(x + 200, y, x + 200, y + 44, { stroke: P.ink, strokeWidth: 8 }));
    for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) add(rc.rectangle(x + 24 + c * 60, y + 104 + r * 56, 40, 36, { stroke: P.peach, strokeWidth: 3, roughness: 0.8 }));
    add(rc.circle(x + 164, y + 178, 70, { stroke: P.red, strokeWidth: 5, roughness: 1.4 }));
  },
  coin(x, y) {
    for (let i = 0; i < 4; i++) add(rc.ellipse(x + 90, y + 260 - i * 34, 170, 56, { fill: P.yellow, fillStyle: "solid", stroke: P.ink, strokeWidth: 3 }));
    add(rc.circle(x + 230, y + 110, 150, { fill: P.yellow, fillStyle: "hachure", hachureGap: 10, stroke: P.ink, strokeWidth: 4 }));
    const w = text("li", "₩", x + 230, y + 70, "middle"); w.style.fontSize = "64px"; w.style.color = P.red;
  },
  hospital(x, y) {
    add(rc.rectangle(x + 10, y + 70, 280, 220, { fill: P.mint, fillStyle: "hachure", hachureGap: 10, stroke: P.ink, strokeWidth: 3 }));
    add(rc.path(`M${x} ${y + 74} L${x + 150} ${y + 10} L${x + 300} ${y + 74} Z`, { fill: P.peach, fillStyle: "solid", stroke: P.ink, strokeWidth: 3 }));
    add(rc.rectangle(x + 100, y + 100, 100, 100, { fill: "#fff", fillStyle: "solid", stroke: P.ink, strokeWidth: 3 }));
    add(rc.line(x + 150, y + 116, x + 150, y + 184, { stroke: P.red, strokeWidth: 12 })); add(rc.line(x + 116, y + 150, x + 184, y + 150, { stroke: P.red, strokeWidth: 12 }));
    add(rc.rectangle(x + 125, y + 225, 50, 65, { fill: "#fff", fillStyle: "solid", stroke: P.ink, strokeWidth: 3 }));
  },
  shield(x, y) {
    add(rc.path(`M${x + 140} ${y + 10} L${x + 260} ${y + 60} C${x + 260} ${y + 190} ${x + 210} ${y + 260} ${x + 140} ${y + 295} C${x + 70} ${y + 260} ${x + 20} ${y + 190} ${x + 20} ${y + 60} Z`, { fill: P.sky, fillStyle: "hachure", hachureGap: 10, stroke: P.ink, strokeWidth: 4 }));
    add(rc.path(`M${x + 85} ${y + 150} l40 45 l80 -95`, { stroke: P.red, strokeWidth: 12, roughness: 0.9 }));
  },
  phone(x, y) {
    add(rc.rectangle(x + 40, y, 190, 300, { fill: "#fff", fillStyle: "solid", stroke: P.ink, strokeWidth: 4, roughness: 1.2 }));
    add(rc.line(x + 110, y + 22, x + 160, y + 22, { stroke: P.ink, strokeWidth: 5 }));
    add(rc.rectangle(x + 62, y + 60, 120, 50, { fill: P.yellow, fillStyle: "solid", stroke: P.ink, strokeWidth: 2 }));
    add(rc.rectangle(x + 90, y + 130, 120, 50, { fill: P.peach, fillStyle: "solid", stroke: P.ink, strokeWidth: 2 }));
    add(rc.rectangle(x + 62, y + 200, 120, 50, { fill: P.mint, fillStyle: "solid", stroke: P.ink, strokeWidth: 2 }));
    add(rc.circle(x + 135, y + 278, 20, { stroke: P.ink, strokeWidth: 3 }));
  },
  pill(x, y) {
    add(rc.rectangle(x + 20, y + 20, 200, 270, { fill: "#fff", fillStyle: "solid", stroke: P.ink, strokeWidth: 4, roughness: 1.3 }));
    add(rc.rectangle(x + 20, y + 20, 200, 60, { fill: "#9FD3F5", fillStyle: "hachure", hachureGap: 8, stroke: P.ink, strokeWidth: 3 }));
    add(rc.line(x + 120, y + 120, x + 120, y + 200, { stroke: P.red, strokeWidth: 12 })); add(rc.line(x + 80, y + 160, x + 160, y + 160, { stroke: P.red, strokeWidth: 12 }));
    add(rc.path(`M${x + 230} ${y + 190} l70 -70 a35 35 0 0 1 50 50 l-70 70 a35 35 0 0 1 -50 -50 Z`, { fill: "#F7A8B8", fillStyle: "solid", stroke: P.ink, strokeWidth: 3 }));
    add(rc.line(x + 265, y + 155, x + 315, y + 205, { stroke: P.ink, strokeWidth: 3 }));
    add(rc.circle(x + 260, y + 280, 50, { fill: P.yellow, fillStyle: "solid", stroke: P.ink, strokeWidth: 3 }));
  },
  bandage(x, y) {
    const g = (n) => { n.setAttribute("transform", `rotate(-30 ${x + 160} ${y + 150})`); return add(n); };
    g(rc.rectangle(x + 10, y + 100, 300, 100, { fill: "#F5D0A9", fillStyle: "solid", stroke: P.ink, strokeWidth: 4, roughness: 1.2 }));
    g(rc.rectangle(x + 110, y + 100, 100, 100, { fill: "#fff", fillStyle: "solid", stroke: P.ink, strokeWidth: 3 }));
    for (const [dx, dy] of [[130, 125], [165, 125], [130, 165], [165, 165], [148, 145]]) g(rc.circle(x + dx + 8, y + dy + 6, 8, { fill: "#C9A27E", fillStyle: "solid", stroke: "none" }));
    add(rc.path(`M${x + 230} ${y + 20} c-8 -14 -30 -4 -18 12 l18 18 l18 -18 c12 -16 -10 -26 -18 -12z`, { fill: "#F48FA6", fillStyle: "solid", stroke: "none" }));
  },
  receipt(x, y) {
    add(rc.path(`M${x + 40} ${y} L${x + 260} ${y} L${x + 260} ${y + 290} l-22 -14 l-22 14 l-22 -14 l-22 14 l-22 -14 l-22 14 l-22 -14 l-22 14 l-22 -14 l-22 14 Z`, { fill: "#fff", fillStyle: "solid", stroke: P.ink, strokeWidth: 4 }));
    for (let i = 0; i < 5; i++) add(rc.line(x + 70, y + 50 + i * 38, x + (i % 2 ? 190 : 230), y + 50 + i * 38, { stroke: "#9FD3F5", strokeWidth: 7 }));
    add(rc.line(x + 70, y + 250, x + 230, y + 250, { stroke: P.red, strokeWidth: 6 }));
    add(rc.circle(x + 290, y + 60, 70, { fill: P.yellow, fillStyle: "solid", stroke: P.ink, strokeWidth: 3 }));
    const w = text("li", "₩", x + 290, y + 30, "middle"); w.style.fontSize = "44px"; w.style.color = P.red;
  },
  piggy(x, y) {
    add(rc.ellipse(x + 150, y + 170, 280, 200, { fill: "#F7A8B8", fillStyle: "hachure", hachureGap: 9, stroke: P.ink, strokeWidth: 4 }));
    add(rc.ellipse(x + 285, y + 170, 46, 60, { fill: "#F48FA6", fillStyle: "solid", stroke: P.ink, strokeWidth: 3 }));
    add(rc.circle(x + 279, y + 160, 7, { fill: P.ink, fillStyle: "solid", stroke: P.ink })); add(rc.circle(x + 292, y + 180, 7, { fill: P.ink, fillStyle: "solid", stroke: P.ink }));
    add(rc.path(`M${x + 200} ${y + 80} l20 -40 l14 46`, { fill: "#F48FA6", fillStyle: "solid", stroke: P.ink, strokeWidth: 3 }));
    add(rc.circle(x + 225, y + 135, 12, { fill: P.ink, fillStyle: "solid", stroke: P.ink }));
    add(rc.line(x + 110, y + 76, x + 170, y + 76, { stroke: P.ink, strokeWidth: 7 }));
    [70, 210].forEach((dx) => add(rc.rectangle(x + dx, y + 250, 34, 44, { fill: "#F48FA6", fillStyle: "solid", stroke: P.ink, strokeWidth: 3 })));
    add(rc.circle(x + 140, y + 10, 64, { fill: P.yellow, fillStyle: "solid", stroke: P.ink, strokeWidth: 3 }));
  },
  hourglass(x, y) {
    add(rc.line(x + 40, y + 10, x + 260, y + 10, { stroke: P.ink, strokeWidth: 10 })); add(rc.line(x + 40, y + 290, x + 260, y + 290, { stroke: P.ink, strokeWidth: 10 }));
    add(rc.path(`M${x + 70} ${y + 20} L${x + 230} ${y + 20} L${x + 160} ${y + 150} L${x + 230} ${y + 280} L${x + 70} ${y + 280} L${x + 140} ${y + 150} Z`, { fill: "#fff", fillStyle: "solid", stroke: P.ink, strokeWidth: 4 }));
    add(rc.path(`M${x + 100} ${y + 60} L${x + 200} ${y + 60} L${x + 150} ${y + 140} Z`, { fill: P.yellow, fillStyle: "solid", stroke: "none" }));
    add(rc.path(`M${x + 95} ${y + 270} L${x + 205} ${y + 270} L${x + 150} ${y + 210} Z`, { fill: P.yellow, fillStyle: "solid", stroke: "none" }));
    add(rc.line(x + 150, y + 150, x + 150, y + 210, { stroke: "#E0A800", strokeWidth: 4 }));
  },
  sprout(x, y) {
    add(rc.path(`M${x + 60} ${y + 170} L${x + 240} ${y + 170} L${x + 210} ${y + 290} L${x + 90} ${y + 290} Z`, { fill: "#E8A27A", fillStyle: "hachure", hachureGap: 9, stroke: P.ink, strokeWidth: 4 }));
    add(rc.line(x + 150, y + 170, x + 150, y + 70, { stroke: "#2FA37F", strokeWidth: 7 }));
    add(rc.ellipse(x + 100, y + 70, 110, 56, { fill: "#7FD1B9", fillStyle: "solid", stroke: "#1E8C68", strokeWidth: 3 }));
    add(rc.ellipse(x + 205, y + 40, 120, 60, { fill: "#7FD1B9", fillStyle: "solid", stroke: "#1E8C68", strokeWidth: 3 }));
    [[60, 20], [250, 110]].forEach(([dx, dy]) => add(rc.circle(x + dx, y + dy, 34, { fill: P.yellow, fillStyle: "solid", stroke: P.ink, strokeWidth: 2 })));
  },
  jar(x, y) {
    add(rc.rectangle(x + 70, y, 160, 36, { fill: "#2FA37F", fillStyle: "solid", stroke: P.ink, strokeWidth: 3 }));
    add(rc.path(`M${x + 60} ${y + 40} L${x + 240} ${y + 40} C${x + 270} ${y + 70} ${x + 270} ${y + 270} ${x + 230} ${y + 290} L${x + 70} ${y + 290} C${x + 30} ${y + 270} ${x + 30} ${y + 70} ${x + 60} ${y + 40} Z`, { fill: "#fff", fillStyle: "solid", stroke: P.ink, strokeWidth: 4 }));
    for (let i = 0; i < 4; i++) add(rc.ellipse(x + 150 + (i % 2 ? 20 : -20), y + 262 - i * 34, 150, 40, { fill: P.yellow, fillStyle: "solid", stroke: "#C99700", strokeWidth: 3 }));
    add(rc.line(x + 80, y + 70, x + 80, y + 150, { stroke: "#CDEBDD", strokeWidth: 8 }));
  },
  heart(x, y) {
    add(rc.path(`M${x + 115} ${y + 270} C${x - 40} ${y + 160} ${x + 20} ${y + 20} ${x + 115} ${y + 90} C${x + 210} ${y + 20} ${x + 270} ${y + 160} ${x + 115} ${y + 270} Z`, { fill: "#F59A9A", fillStyle: "hachure", hachureGap: 9, stroke: "#E05555", strokeWidth: 4 }));
    add(rc.path(`M${x + 20} ${y + 160} L${x + 75} ${y + 160} L${x + 95} ${y + 120} L${x + 125} ${y + 200} L${x + 145} ${y + 160} L${x + 215} ${y + 160}`, { stroke: "#fff", strokeWidth: 7, roughness: 0.6 }));
  },
  clipboard(x, y) {
    add(rc.rectangle(x + 10, y + 20, 220, 270, { fill: P.mint, fillStyle: "hachure", hachureGap: 10, stroke: P.ink, strokeWidth: 3 }));
    add(rc.rectangle(x + 30, y + 50, 180, 220, { fill: "#fff", fillStyle: "solid", stroke: P.ink, strokeWidth: 2 }));
    add(rc.rectangle(x + 80, y + 5, 80, 36, { fill: P.yellow, fillStyle: "solid", stroke: P.ink, strokeWidth: 3 }));
    add(rc.line(x + 120, y + 110, x + 120, y + 200, { stroke: P.red, strokeWidth: 10 })); add(rc.line(x + 75, y + 155, x + 165, y + 155, { stroke: P.red, strokeWidth: 10 }));
  },
  magnifier(x, y) {
    add(rc.rectangle(x, y + 30, 170, 220, { fill: "#fff", fillStyle: "solid", stroke: P.ink, strokeWidth: 3 }));
    for (let i = 0; i < 4; i++) add(rc.line(x + 25, y + 75 + i * 40, x + 145, y + 75 + i * 40, { stroke: P.peach, strokeWidth: 8 }));
    add(rc.circle(x + 160, y + 170, 130, { fill: P.sky, fillStyle: "hachure", hachureGap: 12, stroke: P.ink, strokeWidth: 5 }));
    add(rc.line(x + 205, y + 215, x + 260, y + 275, { stroke: P.ink, strokeWidth: 14 }));
  },
  // 어린이·엄마보험 게시판용
  bottle(x, y) {
    add(rc.path(`M${x + 130} ${y + 10} Q${x + 150} ${y - 5} ${x + 170} ${y + 10} L${x + 180} ${y + 50} L${x + 120} ${y + 50} Z`, { fill: "#FFD66B", fillStyle: "solid", stroke: P.ink, strokeWidth: 3 }));
    add(rc.rectangle(x + 100, y + 50, 100, 34, { fill: "#E0709A", fillStyle: "solid", stroke: P.ink, strokeWidth: 3 }));
    add(rc.rectangle(x + 95, y + 84, 110, 200, { fill: "#fff", fillStyle: "solid", stroke: P.ink, strokeWidth: 4 }));
    add(rc.rectangle(x + 100, y + 180, 100, 100, { fill: "#FDE6EE", fillStyle: "solid", stroke: "none" }));
    for (let i = 0; i < 3; i++) add(rc.line(x + 95, y + 120 + i * 45, x + 130, y + 120 + i * 45, { stroke: "#E0709A", strokeWidth: 4 }));
  },
  stroller(x, y) {
    add(rc.path(`M${x + 40} ${y + 140} A110 110 0 0 1 ${x + 150} ${y + 30} L${x + 150} ${y + 140} Z`, { fill: "#B9A6F0", fillStyle: "hachure", hachureGap: 9, stroke: P.ink, strokeWidth: 4 }));
    add(rc.rectangle(x + 40, y + 140, 220, 70, { fill: "#F7B6CB", fillStyle: "solid", stroke: P.ink, strokeWidth: 4 }));
    add(rc.line(x + 260, y + 140, x + 300, y + 70, { stroke: P.ink, strokeWidth: 6 }));
    add(rc.circle(x + 85, y + 255, 70, { fill: "#fff", fillStyle: "solid", stroke: P.ink, strokeWidth: 5 }));
    add(rc.circle(x + 220, y + 255, 70, { fill: "#fff", fillStyle: "solid", stroke: P.ink, strokeWidth: 5 }));
  },
  bag(x, y) {
    add(rc.path(`M${x + 105} ${y + 60} Q${x + 150} ${y} ${x + 195} ${y + 60}`, { stroke: P.ink, strokeWidth: 7 }));
    add(rc.rectangle(x + 60, y + 60, 180, 220, { fill: "#9FD3F5", fillStyle: "solid", stroke: P.ink, strokeWidth: 4 }));
    add(rc.path(`M${x + 60} ${y + 60} Q${x + 150} ${y + 150} ${x + 240} ${y + 60}`, { fill: "#3A8FD6", fillStyle: "hachure", hachureGap: 8, stroke: P.ink, strokeWidth: 3 }));
    add(rc.rectangle(x + 95, y + 170, 110, 80, { fill: "#FFD66B", fillStyle: "solid", stroke: P.ink, strokeWidth: 3 }));
    add(rc.circle(x + 150, y + 120, 22, { fill: "#E0709A", fillStyle: "solid", stroke: P.ink, strokeWidth: 2 }));
  },
  star(x, y) {
    const pts = []; for (let i = 0; i < 10; i++) { const r = i % 2 ? 60 : 140, a = -Math.PI / 2 + i * Math.PI / 5; pts.push([x + 150 + r * Math.cos(a), y + 150 + r * Math.sin(a)]); }
    add(rc.polygon(pts, { fill: "#FFD66B", fillStyle: "hachure", hachureGap: 8, stroke: "#E0A800", strokeWidth: 4 }));
    add(rc.circle(x + 120, y + 145, 14, { fill: P.ink, fillStyle: "solid", stroke: P.ink })); add(rc.circle(x + 180, y + 145, 14, { fill: P.ink, fillStyle: "solid", stroke: P.ink }));
    add(rc.path(`M${x + 130} ${y + 175} Q${x + 150} ${y + 192} ${x + 170} ${y + 175}`, { stroke: P.ink, strokeWidth: 4, roughness: 0.6 }));
  },
  balloon(x, y) {
    [[95, 110, "#F7A8B8"], [205, 90, "#B9A6F0"], [150, 40, "#FFD66B"]].forEach(([dx, dy, c]) => {
      add(rc.path(`M${x + dx} ${y + dy + 75} Q${x + 150} ${y + 230} ${x + 150} ${y + 290}`, { stroke: P.ink, strokeWidth: 2 }));
      add(rc.ellipse(x + dx, y + dy, 110, 140, { fill: c, fillStyle: "solid", stroke: P.ink, strokeWidth: 3 }));
    });
  },
};

function frame() {
  add(rc.rectangle(28, 28, 1024, 1024, { stroke: TH.frame, strokeWidth: 6, roughness: 2 }));
  for (let i = 0; i < 12; i++) { const x = 60 + i * 84; add(rc.line(x, 1040, x + 40, 1000, { stroke: TH.stripe[i % 2], strokeWidth: 10, roughness: 0.8 })); }
}

function thumb(d) {
  frame();
  const chip = text("chip", d.menu, 92, 92);
  const w = chip.getBoundingClientRect().width;
  add(rc.rectangle(70, 80, w + 44, 72, { fill: TH.chipFill, fillStyle: "solid", stroke: TH.chipLine, strokeWidth: 3 }));
  svg.appendChild(svg.firstChild); // 틀을 뒤로
  const a = text("t1", d.thumb[0], 92, 210), b = text("t2", d.thumb[1], 92, 330);
  fitAll([a, b], 900);
  const bw = b.getBoundingClientRect().width;
  add(rc.path(`M92 462 Q${92 + bw / 2} 448 ${92 + bw} 466`, { stroke: TH.under, strokeWidth: 14, roughness: 1.5 }));
  const s = text("sub", d.sub, 96, 500); fitAll([s], 880);
  ICONS[d.icon](600, 640);
  character(120, 720, 1.6);
  sparkle(520, 680, 20, TH.spark[0]); sparkle(1010, 560, 16, TH.spark[1]); sparkle(90, 640, 14, TH.spark[2]);
  text("brand", "우체국보험 길잡이 카페", 990, 950, "end");
}

function card(d) {
  frame();
  add(rc.rectangle(90, 110, 900, 820, { fill: "#fff", fillStyle: "solid", stroke: P.ink, strokeWidth: 3, roughness: 1.2 }));
  for (let i = 0; i < 6; i++) add(rc.line(130, 330 + i * 110, 950, 330 + i * 110, { stroke: TH.rule, strokeWidth: 2, roughness: 0.5 }));
  add(rc.rectangle(420, 86, 240, 50, { fill: TH.tape, fillStyle: "solid", stroke: "none" })); // 마스킹테이프
  const t = text("ct", d.cardTitle, 540, 170, "middle"); fitAll([t], 820);
  d.card.slice(0, 5).forEach((line, i) => {
    const y = 262 + i * 110;
    add(rc.circle(160, y + 32, 34, { fill: TH.dots[i], fillStyle: "solid", stroke: P.ink, strokeWidth: 2 }));
    const l = text("li", line, 200, y); fitAll([l], 760);
  });
  character(800, 820, 1.05);
  sparkle(150, 880, 16, TH.spark[1]);
}

window.render = (d) => (applyTheme(d.menu), d.kind === "card" ? card(d) : thumb(d), true);
</script></body></html>
