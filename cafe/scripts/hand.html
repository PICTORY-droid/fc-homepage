<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 손그림체 카페 이미지 틀 — make-hand-images.py 가 window.DATA 를 넣고 render() 를 부릅니다. 선은 rough.js(MIT), 글씨는 Jua·Gaegu(OFL) -->
<style>
@font-face{font-family:Jua;src:url(../assets/fonts/jua-korean-400-normal.woff2)}
@font-face{font-family:Gaegu;src:url(../assets/fonts/gaegu-korean-700-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;overflow:hidden;background:#FFFBF4}
#c{position:absolute;inset:0}
.txt{position:absolute;white-space:nowrap}
.chip{font-family:Jua;font-size:40px;color:#A34506}
.t1{font-family:Jua;font-size:100px;color:#3A3A3A;letter-spacing:-1px}
.t2{font-family:Jua;font-size:100px;color:#D9480F;letter-spacing:-1px}
.sub{font-family:Gaegu;font-size:52px;color:#6B5E57}
.brand{font-family:Gaegu;font-size:42px;color:#A34506}
.ct{font-family:Jua;font-size:62px;color:#3A3A3A}
.li{font-family:Gaegu;font-size:54px;color:#3A3A3A}
</style></head>
<body><svg id="c" width="1080" height="1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../assets/vendor/rough.js"></script>
<script>
const svg = document.getElementById("c");
const rc = rough.svg(svg);
const P = { ink: "#4A3F3A", orange: "#FF883A", red: "#D9480F", peach: "#FFDAC1", cream: "#FFF4EC", pink: "#F7A8B8", mint: "#7FD1B9", sky: "#9FD3F5", yellow: "#FFD66B" };
const add = (n) => (svg.appendChild(n), n);
const text = (cls, s, x, y, anchor = "start") => {
  const d = document.createElement("div"); d.className = "txt " + cls; d.textContent = s; document.body.appendChild(d);
  const w = d.getBoundingClientRect().width;
  d.style.left = (anchor === "middle" ? x - w / 2 : anchor === "end" ? x - w : x) + "px"; d.style.top = y + "px"; return d;
};
const fitAll = (els, max) => { for (const e of els) { let f = parseFloat(getComputedStyle(e).fontSize); while (e.getBoundingClientRect().width > max && f > 36) { f -= 2; e.style.fontSize = f + "px"; } } };

// 편지봉투 캐릭터(손그림) — 홈페이지 캐릭터와 같은 생김새
function character(x, y, s = 1) {
  const g = (n) => { n.setAttribute("transform", `translate(${x},${y}) scale(${s})`); return add(n); };
  g(rc.rectangle(35, 55, 130, 100, { fill: "#fff", fillStyle: "solid", stroke: P.orange, strokeWidth: 4, roughness: 1.4 }));
  g(rc.path("M45 52 Q100 14 155 52 Z", { fill: P.orange, fillStyle: "solid", stroke: P.red, strokeWidth: 3, roughness: 1.2 }));
  g(rc.line(40, 52, 160, 52, { stroke: "#C4540A", strokeWidth: 7, roughness: 1 }));
  g(rc.circle(100, 33, 30, { fill: "#fff", fillStyle: "solid", stroke: "#C4540A", strokeWidth: 3 }));
  g(rc.path("M93 33 q7 -9 14 0 q-7 9 -14 0", { stroke: P.red, strokeWidth: 3, roughness: 0.8 }));
  g(rc.line(40, 150, 72, 128, { stroke: P.orange, strokeWidth: 4 })); g(rc.line(160, 150, 128, 128, { stroke: P.orange, strokeWidth: 4 }));
  g(rc.circle(78, 100, 10, { fill: P.ink, fillStyle: "solid", stroke: P.ink })); g(rc.circle(122, 100, 10, { fill: P.ink, fillStyle: "solid", stroke: P.ink }));
  g(rc.path("M88 112 Q100 124 112 112", { stroke: P.ink, strokeWidth: 4, roughness: 0.6 }));
  g(rc.circle(62, 114, 16, { fill: P.pink, fillStyle: "solid", stroke: "none" })); g(rc.circle(138, 114, 16, { fill: P.pink, fillStyle: "solid", stroke: "none" }));
}
function sparkle(x, y, r, c) { add(rc.line(x - r, y, x + r, y, { stroke: c, strokeWidth: 4 })); add(rc.line(x, y - r, x, y + r, { stroke: c, strokeWidth: 4 })); }

// 주제 그림
const ICONS = {
  checklist(x, y) {
    add(rc.rectangle(x, y, 230, 280, { fill: "#fff", fillStyle: "solid", stroke: P.ink, strokeWidth: 3 }));
    for (let i = 0; i < 4; i++) {
      const yy = y + 50 + i * 58;
      add(rc.rectangle(x + 28, yy - 16, 32, 32, { stroke: P.ink, strokeWidth: 3 }));
      add(rc.path(`M${x + 32} ${yy} l10 12 l22 -26`, { stroke: P.red, strokeWidth: 5, roughness: 0.8 }));
      add(rc.line(x + 78, yy, x + 200, yy, { stroke: P.peach, strokeWidth: 8 }));
    }
  },
  ribbon(x, y) {
    add(rc.path(`M${x + 115} ${y + 30} C${x + 40} ${y + 30} ${x + 50} ${y + 140} ${x + 115} ${y + 170} C${x + 180} ${y + 140} ${x + 190} ${y + 30} ${x + 115} ${y + 30} Z`, { fill: P.pink, fillStyle: "hachure", hachureGap: 9, stroke: "#E0607E", strokeWidth: 4 }));
    add(rc.path(`M${x + 95} ${y + 160} L${x + 45} ${y + 280} L${x + 90} ${y + 265} L${x + 115} ${y + 300}`, { stroke: "#E0607E", strokeWidth: 5, fill: P.pink, fillStyle: "solid" }));
    add(rc.path(`M${x + 135} ${y + 160} L${x + 185} ${y + 280} L${x + 140} ${y + 265} L${x + 115} ${y + 300}`, { stroke: "#E0607E", strokeWidth: 5, fill: P.pink, fillStyle: "solid" }));
  },
  heart(x, y) {
    add(rc.path(`M${x + 115} ${y + 270} C${x - 40} ${y + 160} ${x + 20} ${y + 20} ${x + 115} ${y + 90} C${x + 210} ${y + 20} ${x + 270} ${y + 160} ${x + 115} ${y + 270} Z`, { fill: "#F59A9A", fillStyle: "hachure", hachureGap: 9, stroke: "#E05555", strokeWidth: 4 }));
    add(rc.path(`M${x + 20} ${y + 160} L${x + 75} ${y + 160} L${x + 95} ${y + 120} L${x + 125} ${y + 200} L${x + 145} ${y + 160} L${x + 215} ${y + 160}`, { stroke: "#fff", strokeWidth: 7, roughness: 0.6 }));
  },
  clipboard(x, y) {
    add(rc.rectangle(x + 10, y + 20, 220, 270, { fill: P.mint, fillStyle: "hachure", hachureGap: 10, stroke: P.ink, strokeWidth: 3 }));
    add(rc.rectangle(x + 30, y + 50, 180, 220, { fill: "#fff", fillStyle: "solid", stroke: P.ink, strokeWidth: 2 }));
    add(rc.rectangle(x + 80, y + 5, 80, 36, { fill: P.yellow, fillStyle: "solid", stroke: P.ink, strokeWidth: 3 }));
    add(rc.line(x + 120, y + 110, x + 120, y + 200, { stroke: P.red, strokeWidth: 10 })); add(rc.line(x + 75, y + 155, x + 165, y + 155, { stroke: P.red, strokeWidth: 10 }));
  },
  magnifier(x, y) {
    add(rc.rectangle(x, y + 30, 170, 220, { fill: "#fff", fillStyle: "solid", stroke: P.ink, strokeWidth: 3 }));
    for (let i = 0; i < 4; i++) add(rc.line(x + 25, y + 75 + i * 40, x + 145, y + 75 + i * 40, { stroke: P.peach, strokeWidth: 8 }));
    add(rc.circle(x + 160, y + 170, 130, { fill: P.sky, fillStyle: "hachure", hachureGap: 12, stroke: P.ink, strokeWidth: 5 }));
    add(rc.line(x + 205, y + 215, x + 260, y + 275, { stroke: P.ink, strokeWidth: 14 }));
  },
};

function frame() {
  add(rc.rectangle(28, 28, 1024, 1024, { stroke: P.peach, strokeWidth: 6, roughness: 2 }));
  for (let i = 0; i < 12; i++) { const x = 60 + i * 84; add(rc.line(x, 1040, x + 40, 1000, { stroke: i % 2 ? P.orange : P.red, strokeWidth: 10, roughness: 0.8 })); }
}

function thumb(d) {
  frame();
  const chip = text("chip", d.menu, 92, 92);
  const w = chip.getBoundingClientRect().width;
  add(rc.rectangle(70, 80, w + 44, 72, { fill: P.cream, fillStyle: "solid", stroke: P.orange, strokeWidth: 3 }));
  svg.appendChild(svg.firstChild); // 틀을 뒤로
  const a = text("t1", d.thumb[0], 92, 210), b = text("t2", d.thumb[1], 92, 330);
  fitAll([a, b], 900);
  const bw = b.getBoundingClientRect().width;
  add(rc.path(`M92 462 Q${92 + bw / 2} 448 ${92 + bw} 466`, { stroke: P.yellow, strokeWidth: 14, roughness: 1.5 }));
  const s = text("sub", d.sub, 96, 500); fitAll([s], 880);
  ICONS[d.icon](600, 640);
  character(120, 720, 1.6);
  sparkle(520, 680, 20, P.yellow); sparkle(960, 620, 16, P.orange); sparkle(90, 640, 14, P.pink);
  text("brand", "우체국보험 길잡이 카페", 990, 950, "end");
}

function card(d) {
  frame();
  add(rc.rectangle(90, 110, 900, 820, { fill: "#fff", fillStyle: "solid", stroke: P.ink, strokeWidth: 3, roughness: 1.2 }));
  for (let i = 0; i < 6; i++) add(rc.line(130, 330 + i * 110, 950, 330 + i * 110, { stroke: P.peach, strokeWidth: 2, roughness: 0.5 }));
  add(rc.rectangle(420, 86, 240, 50, { fill: P.yellow, fillStyle: "solid", stroke: "none" })); // 마스킹테이프
  const t = text("ct", d.cardTitle, 540, 170, "middle"); fitAll([t], 820);
  d.card.slice(0, 5).forEach((line, i) => {
    const y = 262 + i * 110;
    add(rc.circle(160, y + 32, 34, { fill: [P.orange, P.mint, P.pink, P.sky, P.yellow][i], fillStyle: "solid", stroke: P.ink, strokeWidth: 2 }));
    const l = text("li", line, 200, y); fitAll([l], 760);
  });
  character(800, 820, 1.05);
  sparkle(150, 880, 16, P.orange);
}

window.render = (d) => (d.kind === "card" ? card(d) : thumb(d), true);
</script></body></html>
