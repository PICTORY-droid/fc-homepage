<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 네이버 블로그 사이드바 위젯 — 우체국보험 길잡이 카페의 무료 엑셀 양식(가로 170px 표시 · 2배 크기 340px로 그림).
     make-blog-widget.py 가 카페 대문(door-main.html)의 편지봉투 캐릭터 SVG를 넘겨 render(charSvg) 를 부릅니다.
     카페 분위기: 빨강·주황 사선 띠, 크림·살구 바탕, 살구 테두리 + 아래 그림자 흰 타일, 굵은 고딕, 주황 단추.
     블로그 결: 흰 둥근 카드 + 세로 알약 목록 + 단추 하나. 알약은 실제 엑셀 양식 제목만 씁니다. -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:340px;background:#fff}
body{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;padding:4px 4px 12px}
.card{position:relative;width:332px;border:2px solid #FFDAC1;border-radius:30px;background:linear-gradient(180deg,#FFFFFF 0%,#FFF8F2 70%,#FFF1E6 100%);box-shadow:0 8px 0 #FFDAC1;overflow:hidden;text-align:center;padding:40px 24px 40px}
.stripe{position:absolute;left:0;right:0;height:14px;background:repeating-linear-gradient(135deg,#C23A26 0 22px,#fff 22px 34px,#FF883A 34px 56px,#fff 56px 68px)}
.stripe.top{top:0}.stripe.bot{bottom:0}
.char{width:118px;height:106px;display:block;margin:4px auto 6px}
.chip{display:inline-block;padding:5px 16px;border:2px solid #FF883A;border-radius:20px;background:#fff;color:#C23A26;font-size:19px;font-weight:800;letter-spacing:-.5px}
h1{margin-top:12px;font-size:36px;font-weight:900;color:#333;letter-spacing:-1.5px;line-height:1.15;white-space:nowrap}
h1 b{color:#C23A26}
.sub{margin-top:8px;font-size:20px;font-weight:500;color:#7A6A61;letter-spacing:-.5px;white-space:nowrap}
.pills{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.pill{height:50px;border-radius:25px;background:#fff;border:2px solid #FFDAC1;color:#A34506;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;letter-spacing:-.7px;white-space:nowrap}
.pill:nth-child(even){background:#FFF4EC}
.btn{margin-top:16px;height:60px;border-radius:30px;background:#F36B0E;box-shadow:0 5px 0 #C4540A;color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900;letter-spacing:-.7px}
.foot{margin-top:18px;font-size:18px;font-weight:500;color:#9A8B82;letter-spacing:-.5px}
</style></head>
<body><div class="card" id="card">
<div class="stripe top"></div>
<div id="char"></div>
<span class="chip">우체국보험 길잡이 카페</span>
<h1>무료 <b>엑셀 양식</b></h1>
<div class="sub">60종 · 미리보고 골라 받기</div>
<div class="pills"><!-- 실제 엑셀 양식 제목 그대로(없는 것은 쓰지 않음) -->
  <div class="pill">보험 만기·갱신 달력</div>
  <div class="pill">한 달 가계부</div>
  <div class="pill">생활비 예산표</div>
  <div class="pill">월간 일정 달력</div>
  <div class="pill">주간 업무 계획표</div>
</div>
<div class="btn">양식 받으러 가기 ›</div>
<div class="foot">우체국보험 FC가 무료로 나눠요</div>
<div class="stripe bot"></div>
</div>
<script>
window.render = (charSvg) => { document.getElementById("char").innerHTML = charSvg; return true; };
</script></body></html>
