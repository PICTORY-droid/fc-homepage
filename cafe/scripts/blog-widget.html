<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 네이버 블로그 사이드바 위젯 이미지 틀(가로 170px 표시 · 2배 크기 340px로 그림) — make-blog-widget.py 가 render(kind) 를 부릅니다.
     선은 rough.js(MIT), 글씨는 Jua·Gaegu(OFL). 귀여움은 캐릭터·하트 대신 손그림 선·빗금·파스텔 색감으로만. -->
<style>
@font-face{font-family:Jua;src:url(../assets/fonts/jua-korean-400-normal.woff2)}
@font-face{font-family:Gaegu;src:url(../assets/fonts/gaegu-korean-700-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:340px;overflow:hidden;background:#FFFBF4}
#c{position:absolute;left:0;top:0}
.t{position:absolute;white-space:nowrap;transform:translateX(-50%)}
.chip{font-family:Jua;font-size:24px;color:#A34506}
.h1{font-family:Jua;font-size:52px;color:#3A3A3A;letter-spacing:-1px;line-height:1}
.h2{font-family:Jua;font-size:52px;color:#D9480F;letter-spacing:-1px;line-height:1}
.g{font-family:Gaegu;font-size:27px;color:#6B5E57}
.big{font-family:Jua;font-size:40px;color:#D9480F;line-height:1}
.mid{font-family:Jua;font-size:30px;color:#3A3A3A}
.btn{font-family:Jua;font-size:29px;color:#fff}
.tiny{font-family:Gaegu;font-size:21px;color:#8A7D75}
.lab{font-family:Jua;font-size:19px;color:#fff}
.cell{font-family:Gaegu;font-size:19px;color:#4A3F3A}
</style></head>
<body><svg id="c" width="340" height="700" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../assets/vendor/rough.js"></script>
<script>
const svg = document.getElementById("c"), rc = rough.svg(svg);
const P = { ink: "#4A3F3A", orange: "#FF883A", red: "#D9480F", peach: "#FFDAC1", cream: "#FFF4EC", yellow: "#FFD66B", green: "#3E9B6E", blue: "#2F86C9", purple: "#6A4FC4" };
const add = (n) => (svg.appendChild(n), n);
const T = (cls, s, x, y) => { const d = document.createElement("div"); d.className = "t " + cls; d.textContent = s; d.style.left = x + "px"; d.style.top = y + "px"; document.body.appendChild(d); return d; };
const fit = (el, max) => { let f = parseFloat(getComputedStyle(el).fontSize); while (el.getBoundingClientRect().width > max && f > 12) { f -= 1; el.style.fontSize = f + "px"; } };
const sparkle = (x, y, r, c) => { add(rc.line(x - r, y, x + r, y, { stroke: c, strokeWidth: 4, roughness: 0.6 })); add(rc.line(x, y - r, x, y + r, { stroke: c, strokeWidth: 4, roughness: 0.6 })); };

// 손그림 양식 카드 한 장(엑셀 표 모양) — 색 띠 + 줄 + 이름표
function sheetCard(x, y, w, h, color, label, rot) {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.setAttribute("transform", `rotate(${rot} ${x + w / 2} ${y + h / 2})`);
  const put = (n) => g.appendChild(n);
  put(rc.rectangle(x, y, w, h, { fill: "#fff", fillStyle: "solid", stroke: P.ink, strokeWidth: 2.5, roughness: 1.2 }));
  put(rc.rectangle(x, y, w, 26, { fill: color, fillStyle: "solid", stroke: P.ink, strokeWidth: 2, roughness: 0.9 }));
  for (let k = 1; k <= 3; k++) put(rc.line(x + 8, y + 26 + k * 22, x + w - 8, y + 26 + k * 22, { stroke: "#CFC6BD", strokeWidth: 2, roughness: 0.6 }));
  put(rc.line(x + w * 0.42, y + 26, x + w * 0.42, y + h - 6, { stroke: "#CFC6BD", strokeWidth: 2, roughness: 0.6 }));
  put(rc.rectangle(x + 10, y + 34, w * 0.42 - 18, 12, { fill: color, fillStyle: "hachure", hachureGap: 4, stroke: "none" }));
  svg.appendChild(g);
  const l = T("lab", label, x + w / 2, y + 2); l.style.transform = `translateX(-50%) rotate(${rot}deg)`; l.style.transformOrigin = "50% 50%";
}

function frame(H) {
  svg.setAttribute("height", H); document.body.style.height = H + "px";
  add(rc.rectangle(8, 8, 324, H - 16, { stroke: P.orange, strokeWidth: 4, roughness: 1.8 }));
  for (let i = 0; i < 6; i++) { const x = 24 + i * 52; add(rc.line(x, H - 20, x + 24, H - 42, { stroke: i % 2 ? P.peach : P.red, strokeWidth: 7, roughness: 0.7 })); }
}
function chip(s, y) {
  const c = T("chip", s, 170, y); const w = c.getBoundingClientRect().width;
  add(rc.rectangle(170 - w / 2 - 16, y - 6, w + 32, 42, { fill: P.cream, fillStyle: "solid", stroke: P.orange, strokeWidth: 2.5 }));
  svg.appendChild(svg.lastChild);
}
function button(s, y) {
  add(rc.rectangle(34, y, 272, 62, { fill: P.red, fillStyle: "solid", stroke: "#A34506", strokeWidth: 3, roughness: 1.4 }));
  T("btn", s, 170, y + 13);
}
function under(y, w) { add(rc.path(`M${170 - w / 2} ${y} Q170 ${y - 8} ${170 + w / 2} ${y + 2}`, { stroke: P.yellow, strokeWidth: 10, roughness: 1.4 })); }

// A. 카페 브랜드 + 무료 양식 미끼(추천) — 340×700 → 블로그에 170×350
function guide() {
  frame(700);
  chip("네이버 카페", 30);
  under(202, 200);
  T("h1", "우체국보험", 170, 92); T("h2", "길잡이", 170, 146);
  T("g", "보험 공부 · 청구 방법 · 내 보험 관리", 170, 214).id = "g1"; fit(document.getElementById("g1"), 300);
  sheetCard(40, 262, 92, 100, P.green, "가계부", -8);
  sheetCard(124, 250, 92, 100, P.red, "보험 정리", 0);
  sheetCard(208, 262, 92, 100, P.blue, "편지지", 8);
  sparkle(36, 250, 9, P.yellow); sparkle(306, 252, 9, P.orange);
  T("mid", "무료 엑셀 양식", 170, 392);
  const b = T("big", "60종 나눔", 170, 432);
  under(482, b.getBoundingClientRect().width + 20);
  T("g", "받아서 바로 쓰는 살림·보험 양식", 170, 500).id = "g2"; fit(document.getElementById("g2"), 300);
  button("카페 구경 가기 ›", 552);
  T("tiny", "우체국보험 FC가 운영하는 카페예요", 170, 628).id = "g3"; fit(document.getElementById("g3"), 296);
}

// B. 무료 엑셀 양식 전용 — 340×600 → 블로그에 170×300
function forms() {
  frame(600);
  chip("무료 양식 자료실", 30);
  sheetCard(40, 98, 92, 100, P.green, "가계부", -8);
  sheetCard(124, 86, 92, 100, P.red, "보험 정리", 0);
  sheetCard(208, 98, 92, 100, P.purple, "일정표", 8);
  sparkle(34, 92, 9, P.yellow); sparkle(308, 94, 9, P.orange);
  T("h1", "엑셀 양식", 170, 228);
  const b = T("h2", "60종 무료", 170, 284);
  under(344, b.getBoundingClientRect().width + 16);
  T("g", "가계부 · 보험 정리표 · 편지지", 170, 360).id = "g1"; fit(document.getElementById("g1"), 300);
  T("g", "미리보기 보고 골라 받기", 170, 396);
  button("양식 받으러 가기 ›", 450);
  T("tiny", "우체국보험 길잡이 카페 · 우체국보험 FC 운영", 170, 528).id = "g3"; fit(document.getElementById("g3"), 296);
}
window.render = (k) => (k === "forms" ? forms() : guide(), true);
</script></body></html>
